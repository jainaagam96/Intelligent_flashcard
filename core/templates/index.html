{% load static %}<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>upscEasy</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb;--brand:#4338ca;--brand2:#6366f1;--ok:#16803c;--warn:#a15c00;--bad:#b42318}*{box-sizing:border-box}html{overflow-x:hidden}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh}.logo{font-size:25px;font-weight:800;margin:4px 8px 25px}.logo span{color:#a5b4fc}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#cbd5e1;padding:12px 12px;border-radius:10px;margin:3px 0}.nav button.active,.nav button:hover{background:#252e40;color:#fff}.side small{display:block;color:#94a3b8;margin:30px 8px 8px}.main{padding:28px;max-width:1400px;width:100%;margin:auto;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}.top h1{margin:0;font-size:28px}.pill{padding:7px 10px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}.grid{display:grid;gap:16px;min-width:0}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 2px 8px #10182808;min-width:0}.stat{font-size:28px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.btn{padding:10px 14px;border-radius:10px;background:#eef2ff;color:#3730a3;font-weight:700}.btn.primary{background:var(--brand);color:#fff}.btn.dark{background:#111827;color:#fff}.btn.danger{background:#fee4e2;color:#b42318}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap}.field{display:grid;gap:7px;margin:10px 0}.field label{font-size:13px;font-weight:700}.field input,.field textarea,.field select{width:100%;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:150px;resize:vertical}.notice{padding:11px 13px;border-radius:10px;background:#f8fafc;border:1px solid var(--line);margin:12px 0;font-size:13px}.hidden{display:none!important}.hero{background:linear-gradient(135deg,#111827,#312e81);color:#fff;border-radius:20px;padding:28px;margin-bottom:16px}.hero h2{font-size:32px;margin:0 0 8px}.hero p{color:#cbd5e1;max-width:700px}.metric{padding:16px}.metric .label{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:25px;margin-top:5px}.recall{max-width:900px;margin:auto}.q{font-size:24px;line-height:1.4;font-weight:750;margin:24px 0}.answer{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:16px;line-height:1.6;overflow-wrap:anywhere}.rating{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.rating button{padding:14px;border-radius:12px;font-weight:800}.again{background:#fee4e2;color:#b42318}.hard{background:#fff4e5;color:#9a5b00}.good{background:#e9f9ef;color:#15703b}.easy{background:#e6f0ff;color:#2457a6}.source{font-size:12px;background:#fafafa;border:1px dashed #d0d5dd;padding:10px;border-radius:10px;margin-top:12px;overflow-wrap:anywhere}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);min-width:0}.row:last-child{border-bottom:0}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#f2f4f7;color:#344054}.modal{position:fixed;inset:0;background:#11182799;display:grid;place-items:center;padding:20px;z-index:20}.modalbox{background:#fff;border-radius:18px;padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:13px 16px;border-radius:12px;z-index:30;max-width:calc(100vw - 40px)}.bars{display:flex;align-items:flex-end;height:140px;gap:10px}.bar{flex:1;background:#6366f1;border-radius:7px 7px 0 0;min-height:5px}.empty{padding:40px;text-align:center;color:var(--muted)}.modebar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.modebar button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:10px;font-weight:700}.modebar button.active{background:#eef2ff;color:#3730a3;border-color:#c7d2fe}.uploadbox{border:1px dashed #c7d2fe;background:#f8faff;border-radius:12px;padding:14px}.micstatus{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:8px}.micdot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.micdot.live{background:#dc2626}.manual-list{display:grid;gap:12px}.manual-item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa}
@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.main{padding:22px}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:sticky;top:0;z-index:10;padding:10px 12px;box-shadow:0 2px 12px #0002}.logo{margin:2px 6px 10px;font-size:22px}.nav{display:flex;overflow-x:auto;gap:5px;padding-bottom:3px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{min-width:max-content;width:auto;margin:0;padding:9px 11px;font-size:13px}.side small,.side>.muted,.side>button{display:none}.main{padding:18px}.top{margin-bottom:18px}.top h1{font-size:24px}.g4,.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.main{padding:12px}.top{align-items:flex-start}.top h1{font-size:21px}.top .pill{font-size:11px}.g4,.g3,.g2{grid-template-columns:1fr}.card{padding:14px;border-radius:13px}.hero{padding:20px;border-radius:15px}.hero h2{font-size:23px}.hero p{font-size:14px}.actions{display:grid;grid-template-columns:1fr}.actions .btn{width:100%}.field input,.field textarea,.field select{font-size:16px}.q{font-size:20px}.rating{grid-template-columns:repeat(2,1fr)}.rating button{min-height:68px}.modal{padding:10px}.modalbox{padding:18px;max-height:94vh}.row{align-items:flex-start;flex-direction:column}.row>.tag,.row>.pill{align-self:flex-start}.bars{gap:5px}.modebar{display:grid;grid-template-columns:1fr 1fr}.modebar button{width:100%}.uploadbox{padding:12px}.toast{left:12px;right:12px;bottom:12px;max-width:none}.empty{padding:28px 16px}}

</style></head><body><div id="login" class="modal hidden"><div class="modalbox"><h2>Welcome to upscEasy</h2><p class="muted">Local account for your study data.</p><div id="authMode"><div class="field"><label>Username</label><input id="au"></div><div class="field"><label>Password</label><input id="ap" type="password"></div><div class="actions"><button class="btn primary" onclick="login()">Sign in</button>{% if registration_enabled %}<button class="btn" onclick="register()">Create account</button>{% endif %}</div><div id="authMsg" class="notice hidden"></div></div></div></div>
<div class="app"><aside class="side"><div class="logo">upsc<span>Easy</span></div><div class="nav"><button data-page="dashboard" onclick="go('dashboard')">⌂ Dashboard</button><button data-page="recall" onclick="go('recall')">◉ Active Recall</button><button data-page="creator" onclick="go('creator')">＋ Create Cards</button><button data-page="anki" onclick="go('anki')">▤ Anki Cards</button><button data-page="mains" onclick="go('mains')">✎ AI Mains Lab</button><button data-page="sources" onclick="go('sources')">▤ Sources</button><button data-page="pyqs" onclick="go('pyqs')">▣ PYQs</button><button data-page="memory" onclick="go('memory')">◇ Memory Bank</button><button data-page="exam" onclick="go('exam')">⚡ Exam Mode</button><button data-page="graph" onclick="go('graph')">⌘ Knowledge Graph</button><button data-page="analytics" onclick="go('analytics')">◒ Analytics</button></div><small>Study system</small><div class="muted" style="padding:8px;color:#94a3b8">Knowledge → Retrieval → PYQ → Mains</div><button class="btn" style="margin:25px 8px 0" onclick="logout()">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div id="subtitle" class="muted">Your UPSC learning cockpit</div></div><div><span id="userpill" class="pill">Local</span></div></div><section id="view"></section></main></div><div id="toast" class="toast hidden"></div>
<script>
const $=id=>document.getElementById(id); let page='dashboard'; let currentSourceId=null, me=null, due=[], current=null, revealed=false;
function csrf(){let m=document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);return m?decodeURIComponent(m[1]):''}
async function api(path,opt={}){let o={credentials:'same-origin',...opt};let isForm=o.body instanceof FormData;o.headers={...(isForm?{}:{'Content-Type':'application/json'}),...(opt.headers||{}),'X-CSRFToken':csrf()};let r=await fetch('/api'+path,o);let d=await r.json().catch(()=>({}));if(r.status===401){$('login').classList.remove('hidden');throw new Error('Please sign in')}if(!r.ok)throw new Error(d.error||d.detail||'Request failed');return d}
async function uploadSource(){let f=$('sf').files[0], fd=new FormData();fd.append('title',$('st').value);fd.append('topic_id',$('stopic').value);if(f)fd.append('file',f);else fd.append('text',$('stext').value);let r=await fetch('/api/sources/',{method:'POST',body:fd,credentials:'same-origin'});let d=await r.json();if(!r.ok)throw Error(d.error||'Upload failed');toast('Source saved');go('sources')}
function toast(x){$('toast').textContent=x;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
function go(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
async function render(){let names={dashboard:['Dashboard','Your UPSC learning cockpit'],recall:['Active Recall','Only cards that are due appear in the queue'],creator:['Create Cards','Generate source-linked UPSC recall cards'],anki:['Anki Cards','Find, edit, and remove your saved cards'],mains:['AI Mains Lab','Evaluate structure, content and exam retrieval'],sources:['Sources','Your notes and document provenance'],analytics:['Analytics','Knowledge and retrieval health'],pyqs:['PYQ Bank','Practice previous-year questions and connect them to topics'],memory:['Answer Memory Bank','Reusable introductions, examples, keywords and conclusions'],exam:['Exam Mode','A mixed retrieval session linking recall and PYQs'],graph:['Knowledge Graph','See how topics connect to recall cards and PYQs']};$('title').textContent=names[page][0];$('subtitle').textContent=names[page][1];if(page==='dashboard')return dashboard();if(page==='recall')return recall();if(page==='creator')return creator();if(page==='anki')return ankiCards();if(page==='mains')return mains();if(page==='sources')return sources();if(page==='pyqs')return pyqs();if(page==='memory')return memory();if(page==='exam')return examMode();if(page==='graph')return graph();return analytics()}
async function dashboard(){let d=await api('/dashboard/');$('view').innerHTML=`<div class="hero"><h2>Study less. Recall more. Write better.</h2><p>upscEasy connects source notes, active recall, PYQ-oriented retrieval and AI Mains evaluation in one local-first learning system.</p><div class="actions"><button class="btn primary" onclick="go('recall')">Start due recall</button><button class="btn" onclick="go('creator')">Create recall cards</button><button class="btn" onclick="go('mains')">Evaluate a Mains answer</button></div></div><div class="grid g4">${[['Cards',d.stats.cards],['Due now',d.stats.due],['Reviews',d.stats.reviews],['Mains',d.stats.mains]].map(x=>`<div class="card metric"><div class="label">${x[0]}</div><strong>${x[1]}</strong></div>`).join('')}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h3>Recall states</h3><div class="list">${Object.entries(d.states).map(([k,v])=>`<div class="row"><span>${k}</span><strong>${v}</strong></div>`).join('')}</div></div><div class="card"><h3>Knowledge health by subject</h3>${d.subjects.length?d.subjects.map(s=>`<div class="row"><span>${s.name||'Unsorted'}</span><span class="tag">${s.cards} cards</span></div>`).join(''):'<div class="empty">Create your first topic and cards.</div>'}</div></div>`}
const SUBJECTS=['Polity','Environment','Economy','History','Geography','Science & Technology','International Relations','Society','Governance','Ethics','Anthropology','Current Affairs','Essay'];
let generated=[]; let manualCards=[];
function subjectOptions(selected=''){return SUBJECTS.map(x=>`<option ${x===selected?'selected':''}>${x}</option>`).join('')}
async function creator(){
  $('view').innerHTML=`<div class="modebar"><button id="aiTab" class="active" onclick="setCreatorMode('ai')">🤖 AI Generate</button><button id="manualTab" onclick="setCreatorMode('manual')">✍️ Manual Anki Card</button></div>
  <div id="creatorAi"><div class="grid g2"><div class="card"><h3>AI card generation</h3><p class="muted">Give upscEasy your notes and let AI create source-linked UPSC recall cards.</p><div class="field"><label>Subject</label><select id="cs">${subjectOptions('Polity')}<option value="Other">Other</option></select></div><div class="field"><label>Topic</label><input id="ct" placeholder="Article 21"></div><div class="field"><label>Source title</label><input id="csrc" placeholder="Laxmikanth / class notes / newspaper"></div><div class="field"><label>Notes</label><textarea id="cn" placeholder="Paste notes here..."></textarea></div><div class="field"><label>Or upload TXT / Markdown / CSV / PDF / DOCX</label><input id="cf" type="file" accept=".txt,.md,.csv,.pdf,.docx"></div><div class="field"><label>Number of cards</label><input id="cc" type="number" min="1" max="30" value="8"></div><button class="btn primary" onclick="generate()">Generate UPSC recall cards</button><div id="genmsg" class="notice hidden"></div></div><div class="card"><h3>Review & save</h3><div id="generated" class="empty">Generated cards will appear here for editing before they enter the scheduler.</div></div></div></div>
  <div id="creatorManual" class="hidden"><div class="grid g2"><div class="card"><h3>Manual Anki card</h3><p class="muted">Create your own front/back card. It enters the same Active Recall scheduler as AI-generated cards.</p><div class="field"><label>Subject</label><select id="ms">${subjectOptions('Polity')}<option value="Other">Other</option></select></div><div class="field"><label>Topic</label><input id="mtopic" placeholder="Fundamental Rights"></div><div class="field"><label>Card type</label><select id="mtype"><option value="basic">Basic Recall</option><option value="cloze">Cloze</option><option value="reverse">Reverse</option><option value="compare">Compare</option><option value="sequence">Sequence</option><option value="multi">Multi-point</option><option value="pyq">PYQ Recall</option><option value="mains">Mains Recall</option></select></div><div class="field"><label>Front — recall prompt</label><textarea id="mfront" placeholder="What are the key features of Article 21?"></textarea></div><div class="field"><label>Back — answer</label><textarea id="mback" placeholder="Write the complete answer you want revealed..."></textarea></div><div class="field"><label>Optional source / reference</label><input id="msource" placeholder="Laxmikanth, Chapter 7, p. 123"></div><div class="actions"><button class="btn primary" onclick="addManualCard()">＋ Add card</button><button class="btn" onclick="clearManualForm()">Clear</button></div></div><div class="card"><h3>Cards ready to save</h3><div id="manualList" class="manual-list"><div class="empty">Your manually created cards will appear here.</div></div></div></div></div>`;
}
function setCreatorMode(mode){$('creatorAi').classList.toggle('hidden',mode!=='ai');$('creatorManual').classList.toggle('hidden',mode!=='manual');$('aiTab').classList.toggle('active',mode==='ai');$('manualTab').classList.toggle('active',mode==='manual')}
async function generate(){let f=$('cf').files[0], text=$('cn').value, body;if(f){body=new FormData();body.append('subject',$('cs').value);body.append('topic',$('ct').value);body.append('source_title',$('csrc').value||f.name);body.append('count',$('cc').value);body.append('file',f)}else{body=JSON.stringify({subject:$('cs').value,topic:$('ct').value,source_title:$('csrc').value||'My notes',notes:text,count:+$('cc').value})}$('genmsg').textContent='Generating…';$('genmsg').classList.remove('hidden');try{let opt={method:'POST',body};if(!f)opt.headers={'Content-Type':'application/json'};let d=await api('/cards/generate/',opt);generated=d.cards;currentSourceId=d.source_id;$('genmsg').textContent=`${d.count} cards generated ${d.ai?'with AI':'with local fallback'}; source ranges were reconstructed server-side.`;renderGenerated()}catch(e){$('genmsg').textContent=e.message||'Generation failed'}}
function renderGenerated(){$('generated').innerHTML=generated.length?generated.map((c,i)=>`<div class="manual-item"><div class="field"><label>Front / Prompt</label><input id="q${i}" value="${esc(c.q)}"></div><div class="field"><label>Back / Answer</label><textarea id="a${i}">${esc(c.a)}</textarea></div><div class="source">${esc(c.source.title)} · lines ${c.source.lineStart}-${c.source.lineEnd}<br>${esc(c.source.excerpt)}</div><button class="btn danger" onclick="generated.splice(${i},1);renderGenerated()">Remove</button></div>`).join('')+`<button class="btn primary" onclick="saveGenerated()">Save ${generated.length} cards to scheduler</button>`:'<div class="empty">No cards yet.</div>'}
let ankiData=[],ankiEditingId=null;
async function ankiCards(){try{ankiData=await api('/cards/');ankiEditingId=null;$('view').innerHTML=`<div class="card"><div class="grid g3"><div class="field"><label>Search cards</label><input id="ankiSearch" placeholder="Search front or back…" oninput="renderAnkiList()"></div><div class="field"><label>Subject</label><select id="ankiSubject" onchange="renderAnkiList()"></select></div><div class="field"><label>Topic</label><select id="ankiTopic" onchange="renderAnkiList()"></select></div></div></div><div id="ankiResults" class="list" style="margin-top:14px"></div>`;renderAnkiList()}catch(e){$('view').innerHTML=`<div class="card empty">${esc(e.message)}</div>`}}
function renderAnkiList(){let search=$('ankiSearch').value.trim().toLowerCase(),subject=$('ankiSubject').value,topic=$('ankiTopic').value;let subjects=[...new Set(ankiData.map(c=>c.subject).filter(Boolean))].sort(),topics=[...new Set(ankiData.map(c=>c.topic).filter(t=>t&&t!=='Unsorted'))].sort();$('ankiSubject').innerHTML='<option value="">All subjects</option>'+subjects.map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join('');$('ankiTopic').innerHTML='<option value="">All topics</option>'+topics.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');$('ankiSubject').value=subject;$('ankiTopic').value=topic;let matches=ankiData.filter(c=>(!subject||c.subject===subject)&&(!topic||c.topic===topic)&&(!search||`${c.q} ${c.a}`.toLowerCase().includes(search)));$('ankiResults').innerHTML=matches.length?`<div class="muted" style="padding:4px 2px">Showing ${matches.length} of ${ankiData.length} cards</div>`+matches.map(c=>`<article class="card"><div class="row" style="padding:0 0 10px"><div><span class="tag">${esc(c.subject||'No subject')} · ${esc(c.topic||'Unsorted')}</span><span class="tag">${esc(c.type)}</span><span class="tag">${esc(c.state)} · ${c.reps} reviews</span></div><div class="actions"><button class="btn" onclick="editAnkiCard(${c.id})">Edit</button><button class="btn danger" onclick="deleteAnkiCard(${c.id})">Delete</button></div></div>${ankiEditingId===c.id?`<div class="field"><label>Front / question</label><textarea id="ankiQ${c.id}">${esc(c.q)}</textarea></div><div class="field"><label>Back / answer</label><textarea id="ankiA${c.id}">${esc(c.a)}</textarea></div><div class="grid g2"><div class="field"><label>Subject</label><input id="ankiS${c.id}" value="${esc(c.subject)}" placeholder="e.g. Polity"></div><div class="field"><label>Topic</label><input id="ankiT${c.id}" value="${esc(c.topic==='Unsorted'?'':c.topic)}" placeholder="Leave blank to remove topic"></div></div><div class="field"><label>Card type</label><select id="ankiType${c.id}">${[['basic','Basic Recall'],['cloze','Cloze'],['reverse','Reverse'],['compare','Compare'],['sequence','Sequence'],['multi','Multi-point'],['pyq','PYQ Recall'],['mains','Mains Recall']].map(([v,n])=>`<option value="${v}" ${v===c.type?'selected':''}>${n}</option>`).join('')}</select></div><div class="actions"><button class="btn primary" onclick="saveAnkiCard(${c.id})">Save changes</button><button class="btn" onclick="ankiEditingId=null;renderAnkiList()">Cancel</button></div>`:`<h3 style="white-space:pre-wrap">${esc(c.q)}</h3><div class="answer" style="white-space:pre-wrap">${esc(c.a)}</div>${c.source.title?`<div class="source">Source: ${esc(c.source.title)}</div>`:''}`}</article>`).join(''):'<div class="card empty">No cards match these filters.</div>'}
function editAnkiCard(id){ankiEditingId=id;renderAnkiList()}
async function saveAnkiCard(id){try{let d=await api(`/cards/${id}/`,{method:'PATCH',body:JSON.stringify({q:$(`ankiQ${id}`).value,a:$(`ankiA${id}`).value,subject:$(`ankiS${id}`).value,topic:$(`ankiT${id}`).value,type:$(`ankiType${id}`).value})});let i=ankiData.findIndex(c=>c.id===id);if(i>=0)ankiData[i]=d;ankiEditingId=null;renderAnkiList();toast('Card updated')}catch(e){toast(e.message)}}
async function deleteAnkiCard(id){if(!confirm('Delete this card and its review history? This cannot be undone.'))return;try{await api(`/cards/${id}/`,{method:'DELETE'});ankiData=ankiData.filter(c=>c.id!==id);ankiEditingId=null;renderAnkiList();toast('Card deleted')}catch(e){toast(e.message)}}
async function saveGenerated(){generated.forEach((c,i)=>{c.q=$('q'+i).value;c.a=$('a'+i).value;c.subject=$('cs').value;c.topic=$('ct').value});let d=await api('/cards/save/',{method:'POST',body:JSON.stringify({cards:generated,source_id:currentSourceId})});toast(`${d.count} cards saved`);generated=[];go('recall')}
function clearManualForm(){$('mfront').value='';$('mback').value='';$('msource').value=''}
function addManualCard(){let front=$('mfront').value.trim(),back=$('mback').value.trim();if(!front||!back){toast('Add both front and back content');return}manualCards.push({q:front,a:back,subject:$('ms').value,topic:$('mtopic').value.trim()||'Unsorted',type:$('mtype').value,source:{title:$('msource').value.trim()}});clearManualForm();renderManualList()}
function renderManualList(){$('manualList').innerHTML=manualCards.length?manualCards.map((c,i)=>`<div class="manual-item"><div><span class="tag">${esc(c.subject)} · ${esc(c.type)}</span><strong style="display:block;margin-top:7px">${esc(c.q)}</strong><div class="muted" style="margin-top:5px">${esc(c.a).slice(0,180)}${c.a.length>180?'…':''}</div></div><button class="btn danger" style="margin-top:10px" onclick="manualCards.splice(${i},1);renderManualList()">Remove</button></div>`).join('')+`<button class="btn primary" onclick="saveManualCards()">Save ${manualCards.length} cards to scheduler</button>`:'<div class="empty">Your manually created cards will appear here.</div>'}
async function saveManualCards(){if(!manualCards.length)return;let d=await api('/cards/save/',{method:'POST',body:JSON.stringify({cards:manualCards})});toast(`${d.count} manual cards saved`);manualCards=[];go('recall')}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function recall(){let d=await api('/cards/due/');due=d.cards;current=due[0]||null;revealed=false;$('view').innerHTML=`<div class="recall">${current?recallCard():`<div class="card empty"><h2>Nothing is due 🎉</h2><p>There are no cards whose scheduled time has arrived.</p><button class="btn primary" onclick="go('creator')">Create more cards</button></div>`}</div>`}
function recallCard(){return `<div class="card"><div class="actions"><span class="pill">${current.state}</span><span class="tag">${current.topic}</span><span class="tag">${due.length} due</span></div><div class="q">${esc(current.q)}</div>${revealed?`<div class="answer"><strong>Answer</strong><br>${esc(current.a)}<div class="source">${esc(current.source.title||'Source')} · lines ${current.source.lineStart||'?'}-${current.source.lineEnd||'?'}<br>${esc(current.source.excerpt||'')}</div></div>`:`<button class="btn primary" onclick="revealed=true;renderRecallCard()">Reveal answer</button>`}${revealed?`<div class="rating"><button class="again" onclick="grade('again')">Again<br><small>1–10 min</small></button><button class="hard" onclick="grade('hard')">Hard<br><small>shorter</small></button><button class="good" onclick="grade('good')">Good<br><small>normal</small></button><button class="easy" onclick="grade('easy')">Easy<br><small>long</small></button></div>`:''}</div>`}
function renderRecallCard(){$('view').querySelector('.recall').innerHTML=recallCard()}
async function grade(r){let t=performance.now();await api('/cards/'+current.id+'/review/',{method:'POST',body:JSON.stringify({rating:r,response_ms:Math.round(t-(window.recallStart||t))})});due.shift();current=due[0]||null;revealed=false;window.recallStart=performance.now();$('view').innerHTML=`<div class="recall">${current?recallCard():`<div class="card empty"><h2>Session complete</h2><p>No more due cards in this queue.</p><button class="btn primary" onclick="go('dashboard')">Back to dashboard</button></div>`}</div>`}
let mainsMode='text'; let mainsTab='evaluate'; let speechRecognition=null;
async function mains(){ $('view').innerHTML=`<div class="modebar"><button id="mainsEvaluateTab" class="active" onclick="setMainsTab('evaluate')">Evaluate my answer</button><button id="mainsGenerateTab" onclick="setMainsTab('generate')">Generate model answer</button></div><div id="mainsEvaluatePanel"><div class="grid g2"><div class="card"><h3>My Mains answer</h3><div class="field"><label>Marks</label><select id="mm"><option>10</option><option>15</option><option>20</option></select></div><div class="field"><label>Mains question</label><textarea id="mq" placeholder="Enter the UPSC Mains question"></textarea></div><div class="modebar"><button id="mTextTab" class="active" onclick="setMainsMode('text')">⌨️ Type</button><button id="mUploadTab" onclick="setMainsMode('upload')">📄 Scan / PDF</button><button id="mMicTab" onclick="setMainsMode('mic')">🎙️ Dictate</button></div><div id="mTextMode"><div class="field"><label>Your answer</label><textarea id="ma" style="min-height:360px" placeholder="Write your answer here..."></textarea></div></div><div id="mUploadMode" class="hidden"><div class="uploadbox"><strong>Upload your handwritten answer</strong><p class="muted">Upload a clear scanned page/photo or PDF of the notebook answer. AI will read the handwriting and evaluate the answer.</p><input id="answerFile" type="file" accept="image/*,.pdf"><div id="fileName" class="muted" style="margin-top:8px">No file selected.</div></div></div><div id="mMicMode" class="hidden"><div class="field"><label>Dictate your notebook answer</label><textarea id="maMic" style="min-height:300px" placeholder="Tap Start dictation and read your written answer aloud..."></textarea></div><div class="actions"><button id="micBtn" class="btn primary" onclick="toggleDictation()">🎙️ Start dictation</button><button class="btn" onclick="stopDictation()">Stop</button></div><div class="micstatus"><span id="micDot" class="micdot"></span><span id="micStatus">Microphone ready. Your words will appear in the answer box.</span></div></div><button id="evaluateMainsBtn" class="btn primary" type="button" style="margin-top:14px">Evaluate answer</button><div class="notice">Choose <strong>Type</strong> for direct writing, <strong>Scan / PDF</strong> for a handwritten answer, or <strong>Dictate</strong> to read your notebook answer aloud.</div></div><div class="card"><h3>Evaluation</h3><div id="me" class="empty">Your evaluation will appear here.</div><hr><h3>Saved evaluations</h3><div class="field"><label>Search question or answer</label><input id="savedMainsQuery" placeholder="Type a keyword…" onkeydown="if(event.key==='Enter')loadSavedMains()"></div><div class="actions"><div class="field"><label>Show</label><select id="savedMainsLimit" onchange="loadSavedMains()"><option value="5" selected>5</option><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="100">100</option></select></div><button class="btn" type="button" onclick="loadSavedMains()">Search</button></div><div id="savedMains" class="empty">Loading saved evaluations…</div></div></div></div><div id="mainsGeneratePanel" class="hidden"><div class="grid g2"><div class="card"><h3>Generate a UPSC Mains model answer</h3><div class="field"><label>Marks</label><select id="modelMarks"><option>10</option><option>15</option><option>20</option></select></div><div class="field"><label>Mains question</label><textarea id="modelQuestion" placeholder="Enter the UPSC Mains question"></textarea></div><button id="generateModelAnswerBtn" class="btn primary" type="button" onclick="generateMainsModelAnswer()">✦ Generate model answer</button><p class="muted">The answer will follow the question’s directive and use an introduction, organized body, and conclusion.</p></div><div class="card"><h3>Model answer</h3><div id="modelAnswerResult" class="empty">Enter a question and generate a model answer.</div></div></div></div>`;setMainsTab('evaluate');setMainsMode('text');$('answerFile').addEventListener('change',()=>{$('fileName').textContent=$('answerFile').files[0]?.name||'No file selected.'});$('evaluateMainsBtn').addEventListener('click',evaluate);loadSavedMains()}
function setMainsTab(tab){mainsTab=tab;$('mainsEvaluatePanel').classList.toggle('hidden',tab!=='evaluate');$('mainsGeneratePanel').classList.toggle('hidden',tab!=='generate');$('mainsEvaluateTab').classList.toggle('active',tab==='evaluate');$('mainsGenerateTab').classList.toggle('active',tab==='generate')}
async function generateMainsModelAnswer(){let q=$('modelQuestion')?.value.trim()||'',out=$('modelAnswerResult'),btn=$('generateModelAnswerBtn');if(!q){out.innerHTML='<div class="notice">Enter the Mains question first.</div>';return}out.innerHTML='<div class="empty">Generating a UPSC Mains model answer…</div>';if(btn){btn.disabled=true;btn.textContent='Generating…'}try{let d=await api('/mains/model-answer/',{method:'POST',body:JSON.stringify({question:q,max_marks:$('modelMarks').value})});out.innerHTML=`<p class="muted">${esc(d.demand_summary||'')} · ${d.word_count} words · ${d.max_marks} marks</p><div style="white-space:pre-wrap;line-height:1.7">${esc(d.answer)}</div>`}catch(err){out.innerHTML=`<div class="notice"><strong>Could not generate the model answer:</strong> ${esc(err.message||String(err))}</div>`}finally{if(btn){btn.disabled=false;btn.textContent='✦ Generate model answer'}}}
function setMainsMode(mode){mainsMode=mode;['text','upload','mic'].forEach(x=>{let el=$('m'+x.charAt(0).toUpperCase()+x.slice(1)+'Mode');if(el)el.classList.toggle('hidden',mode!==x)});['mTextTab','mUploadTab','mMicTab'].forEach(id=>$(id)?.classList.remove('active'));$('m'+mode.charAt(0).toUpperCase()+mode.slice(1)+'Tab')?.classList.add('active');if(mode==='mic')ensureSpeechSupport()}
function ensureSpeechSupport(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){$('micStatus').textContent='Speech recognition is not supported in this browser. Use Chrome/Edge or choose Type/Scan.'}}
function toggleDictation(){if(speechRecognition){stopDictation();return}let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){ensureSpeechSupport();return}speechRecognition=new SR();speechRecognition.continuous=true;speechRecognition.interimResults=true;speechRecognition.lang='en-IN';let finalText=$('maMic').value.trim();speechRecognition.onstart=()=>{$('micBtn').textContent='⏹ Stop dictation';$('micDot').classList.add('live');$('micStatus').textContent='Listening… read your notebook answer naturally.'};speechRecognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText=(finalText?finalText+' ':'')+t.trim();else interim+=t}$('maMic').value=finalText+(interim?' '+interim:'')};speechRecognition.onerror=e=>{$('micStatus').textContent='Microphone error: '+e.error+'. You can continue typing or try again.';stopDictation()};speechRecognition.onend=()=>{speechRecognition=null;$('micBtn').textContent='🎙️ Start dictation';$('micDot').classList.remove('live');if($('micStatus'))$('micStatus').textContent='Dictation stopped. You can edit the transcript before evaluation.'};speechRecognition.start()}
function stopDictation(){if(speechRecognition){speechRecognition.stop();speechRecognition=null}$('micBtn')?.setAttribute('aria-pressed','false');$('micDot')?.classList.remove('live')}
let savedMainsCache=[];
async function loadSavedMains(){try{let q=$('savedMainsQuery')?.value.trim()||'',limit=$('savedMainsLimit')?.value||'5';savedMainsCache=await api(`/mains/evaluations/?q=${encodeURIComponent(q)}&limit=${encodeURIComponent(limit)}`);let el=$('savedMains');if(!el)return;el.innerHTML=savedMainsCache.length?savedMainsCache.map(s=>`<button class="row" style="width:100%;text-align:left;cursor:pointer" onclick="openSavedMains(${s.id})"><span><strong>${esc(s.question.slice(0,110))}${s.question.length>110?'…':''}</strong><div class="muted">${new Date(s.created_at).toLocaleString()}</div></span><span class="tag">${s.marks}/${s.max_marks}</span></button>`).join(''):'<div class="empty">No matching saved evaluations.</div>'}catch(e){let el=$('savedMains');if(el)el.innerHTML='<div class="muted">Could not load saved evaluations.</div>'}}
function showMainsResult(d){let e=d.evaluation||{};let currentNames=['Context and Directive','Content, Evidence and Analysis','Language and Expression','Introduction','Structure, Presentation and Visuals','Conclusion'];let current=Array.isArray(e.rubric)&&currentNames.every(n=>e.rubric.some(r=>r.criterion===n));let oldRubric=Array.isArray(e.rubric)&&e.rubric.length&&!current;let banner=d.ai===false?'<div class="notice">Local fallback was used. It cannot provide reliable examiner-style criterion scores.</div>':'';let rubric=current?`<h4>Examiner-style indicators</h4><p class="muted">Scale: 1 Poor · 2 Average · 3 Good · 4 Excellent · 5 Outstanding</p>${e.rubric.map(r=>`<div class="row"><div><strong>${esc(r.criterion)}</strong><div class="muted">${esc(r.feedback)}</div></div><span class="tag">${Math.max(1,Math.min(5,Math.round(r.score)))}/5</span></div>`).join('')}<p class="muted">Indicator scores are diagnostic; the overall mark is a holistic judgment for this question, with no fixed percentage formula.</p>`:oldRubric?`<h4>Earlier evaluation indicators</h4><div class="notice">This saved result uses the previous experimental /100 rubric and is not directly comparable with the current 1–5 indicators.</div>${e.rubric.map(r=>`<div class="row"><div><strong>${esc(r.criterion)}</strong><div class="muted">${esc(r.feedback)}</div></div><span class="tag">${Math.round(r.score)}/100</span></div>`).join('')}`:'';$('me').innerHTML=`${banner}<div class="stat">${d.marks}/${d.max_marks}</div><p>${esc(e.summary||'Evaluation completed.')}</p><p class="muted">Saved to your evaluation history.</p>${rubric}${!current&&!oldRubric&&d.ai===false?'<p class="muted">The local score is a rough length-based fallback, not an examiner assessment.</p>':''}<h4>Reusable keywords</h4><p>${(e.keywords||[]).map(x=>`<span class="tag">${esc(x)}</span> `).join('')||'<span class="muted">None extracted.</span>'}</p><h4>Examples / evidence identified</h4><ul>${(e.examples||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No explicit examples identified.</li>'}</ul><h4>Omissions</h4><ul>${(e.omissions||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>No omissions listed.</li>'}</ul><h4>Dimensions</h4><ul>${(e.dimensions||[]).map(x=>`<li>${esc(x)}</li>`).join('')||'<li>None listed.</li>'}</ul>`}
function openSavedMains(id){let s=savedMainsCache.find(x=>x.id===id);if(!s)return;$('mq').value=s.question;$('ma').value=s.answer||'';$('mm').value=String(s.max_marks);showMainsResult(s)}
async function evaluate(){
 let q=$('mq')?.value.trim()||'',a=mainsMode==='mic'?($('maMic')?.value.trim()||''):mainsMode==='text'?($('ma')?.value.trim()||''):'';
 let file=mainsMode==='upload'?($('answerFile')?.files?.[0]||null):null;
 if(!q||(!a&&!file)){ $('me').innerHTML='<div class="notice">Enter the question and provide an answer by typing, dictating, or uploading a scanned image/PDF.</div>';return }
 stopDictation();
 let b=$('evaluateMainsBtn');
 if(b){b.disabled=true;b.textContent='Evaluating…'}
 $('me').innerHTML='<div class="empty">Reading and evaluating your answer…</div>';
 try{
   let fd=new FormData();
   fd.append('question',q);fd.append('answer',a);fd.append('max_marks',$('mm').value);
   if(file)fd.append('answer_file',file,file.name);
   let d=await api('/mains/evaluate/',{method:'POST',body:fd});
   showMainsResult(d);loadSavedMains();
 }catch(err){
   console.error('Mains evaluation failed',err);
   $('me').innerHTML=`<div class="notice"><strong>Evaluation failed:</strong> ${esc(err.message||String(err))}<br><span class="muted">Check that Django is running, you are signed in, and the OpenAI API key/model are configured.</span></div>`;
 }finally{if(b){b.disabled=false;b.textContent='Evaluate answer'}}
}

async function sources(){let [ss,ts]=await Promise.all([api('/sources/'),api('/topics/')]);$('view').innerHTML=`<div class="grid g2"><div class="card"><h3>Add source</h3><div class="field"><label>Title</label><input id="st"></div><div class="field"><label>Topic</label><select id="stopic"><option value="">No topic</option>${ts.map(t=>`<option value="${t.id}">${esc(t.subject)} · ${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Paste notes</label><textarea id="stext"></textarea></div><div class="field"><label>Or file</label><input id="sf" type="file" accept=".txt,.md,.csv,.pdf,.docx"></div><button class="btn primary" onclick="uploadSource()">Save source</button></div><div class="card"><h3>Your sources</h3>${ss.length?ss.map(s=>`<div class="row"><div><strong>${esc(s.title)}</strong><div class="muted">${esc(s.topic||'Unsorted')} · ${s.type}</div></div><span class="tag">${s.created_at.slice(0,10)}</span></div>`).join(''):'<div class="empty">No sources yet.</div>'}</div></div>`}
async function pyqs(){let [qs,ts]=await Promise.all([api('/pyqs/'),api('/topics/')]);$('view').innerHTML=`<div class="grid g2"><div class="card"><h3>Add PYQ</h3><div class="field"><label>Year</label><input id="py" type="number" value="2025"></div><div class="field"><label>Subject</label><input id="ps" value="Polity"></div><div class="field"><label>Paper</label><select id="pp"><option>Prelims</option><option>Mains GS-I</option><option>Mains GS-II</option><option>Mains GS-III</option><option>Mains GS-IV</option></select></div><div class="field"><label>Question</label><textarea id="pq"></textarea></div><div class="field"><label>Answer / key</label><textarea id="pa"></textarea></div><button class="btn primary" onclick="addPYQ()">Save PYQ</button></div><div class="card"><h3>PYQ Bank</h3>${qs.length?qs.map(q=>`<div class="row"><div><span class="tag">${q.year} · ${esc(q.paper)}</span><p style="margin:6px 0">${esc(q.question)}</p></div><span class="muted">${esc(q.subject)}</span></div>`).join(''):'<div class="empty">Add your first PYQ.</div>'}</div></div>`}
async function addPYQ(){await api('/pyqs/',{method:'POST',body:JSON.stringify({year:+$('py').value,subject:$('ps').value,paper:$('pp').value,question:$('pq').value,answer:$('pa').value})});toast('PYQ saved');pyqs()}
async function memory(){let ms=await api('/memory/');$('view').innerHTML=`<div class="grid g2"><div class="card"><h3>Add reusable exam material</h3><div class="field"><label>Type</label><select id="mt"><option value="intro">Introduction</option><option value="example">Example</option><option value="case">Case/Committee</option><option value="keyword">Keyword</option><option value="conclusion">Conclusion</option></select></div><div class="field"><label>Text</label><textarea id="mx"></textarea></div><button class="btn primary" onclick="addMemory()">Save to Memory Bank</button></div><div class="card"><h3>Reusable bank</h3>${ms.length?ms.map(m=>`<div class="row"><div><span class="tag">${m.item_type}</span><div style="margin-top:5px">${esc(m.text)}</div></div></div>`).join(''):'<div class="empty">Your reusable answer material will appear here.</div>'}</div></div>`}
async function addMemory(){await api('/memory/',{method:'POST',body:JSON.stringify({item_type:$('mt').value,text:$('mx').value})});toast('Saved');memory()}
async function examMode(){let d=await api('/exam-mode/');$('view').innerHTML=`<div class="hero"><h2>Exam Mode</h2><p>Mixed retrieval: due cards first, then PYQ application.</p><button class="btn primary" onclick="go('recall')">Start recall queue</button></div><div class="grid g2"><div class="card"><h3>Due recall</h3>${d.recall.length?d.recall.map(c=>`<div class="row"><span>${esc(c.q)}</span><span class="tag">${c.state}</span></div>`).join(''):'<div class="empty">No due cards.</div>'}</div><div class="card"><h3>PYQ application</h3>${d.pyqs.length?d.pyqs.map(q=>`<div class="row"><div><span class="tag">${q.year} · ${esc(q.paper)}</span><div style="margin-top:5px">${esc(q.question)}</div></div></div>`).join(''):'<div class="empty">Add PYQs to activate this layer.</div>'}</div></div>`}
async function graph(){let d=await api('/knowledge-graph/');$('view').innerHTML=`<div class="card"><h3>Knowledge Graph</h3><p class="muted">${d.nodes.length} nodes · ${d.edges.length} connections</p><div class="list">${d.nodes.map(n=>`<div class="row"><span><span class="tag">${n.type}</span> ${esc(n.label)}</span></div>`).join('')||'<div class="empty">Create topics, cards and PYQs to build the graph.</div>'}</div></div>`}
async function analytics(){let d=await api('/analytics/');let total=d.retrieval.reviewed,success=d.retrieval.successful,rate=total?Math.round(success/total*100):0;$('view').innerHTML=`<div class="grid g4"><div class="card metric"><div class="label">Total cards</div><strong>${d.total_cards}</strong></div><div class="card metric"><div class="label">Due</div><strong>${d.due}</strong></div><div class="card metric"><div class="label">Recall success</div><strong>${rate}%</strong></div><div class="card metric"><div class="label">Average Mains marks</div><strong>${Number(d.avg_mains).toFixed(1)}</strong></div></div><div class="card" style="margin-top:16px"><h3>Review distribution</h3><div class="bars">${[['Again',d.again],['Hard',d.hard],['Good',d.good],['Easy',d.easy]].map(x=>`<div style="flex:1;text-align:center"><div class="bar" style="height:${Math.max(5,x[1]*12)}px"></div><small>${x[0]}<br>${x[1]}</small></div>`).join('')}</div></div>`}
async function login(){let d=await api('/auth/login/',{method:'POST',body:JSON.stringify({username:$('au').value,password:$('ap').value})});me=d.user;$('login').classList.add('hidden');$('userpill').textContent=me;go('dashboard')}
async function register(){let d=await api('/auth/register/',{method:'POST',body:JSON.stringify({username:$('au').value,password:$('ap').value})});me=d.user;$('login').classList.add('hidden');$('userpill').textContent=me;go('dashboard')}
